plugins {
    id 'fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // The Fabric maven is already available through Loom.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is the newest version for 1.21.11
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LWJGL NanoVG - shipped at runtime as nested jars (see fabric.mod.json "jars")
    compileOnly "org.lwjgl:lwjgl-nanovg:3.3.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Print the full compile classpath (used by the deobfuscation pipeline)
tasks.register('printClasspath') {
    doLast {
        def cp = configurations.minecraftLibraries.files + configurations.modCompileClasspath.files
        cp.each { println it.absolutePath }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
